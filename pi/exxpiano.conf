# /etc/exxpiano.conf - synthesizer settings.
# After editing:  rc-service exxpiano restart; rc-service exxpiano-fx restart

# Sound banks (made by scripts/make-soundfonts.sh)
PIANO_SF2=/opt/exxpiano/soundfonts/piano.sf2
MECH_SF2=/opt/exxpiano/soundfonts/mech.sf2
# The small piano bank that plays while the piano bank loads (at the start and after a switch of the bank), so the keys sound after a few
# seconds instead of a minute. Empty, missing or damaged: the module is silent until the piano bank is loaded, as before. Without this line
# (a file kept from an earlier version) the installed preview bank is used.
PREVIEW_SF2=/opt/exxpiano/soundfonts/piano-preview.sf2

# Folder with the piano banks that the web page offers under "Piano bank" (*.sf2 / *.sf3; the mechanics bank is never offered).
BANK_DIR=/opt/exxpiano/soundfonts

# Where the web page remembers the touch, volume, mechanics and preset of each bank (one JSON file).
PROFILE_FILE=/var/lib/exxpiano/profiles.json
# Same for the buffers of each audio interface (devices.json in the same folder unless set here):
# DEVICE_PROFILE_FILE=/var/lib/exxpiano/devices.json

# Written by the web page after every successful bank switch: the bank to fall back to when PIANO_SF2 is missing or damaged.
PIANO_SF2_LAST_GOOD=

# Audio output. auto = a USB sound card if one is present, otherwise the onboard 3.5 mm jack (re-chosen when a USB
# card is plugged in or removed). Or name one explicitly (see `aplay -l`), e.g. plughw:Headphones or plughw:U24.
# Always use the "plughw" form: USB interfaces often accept only 24/32-bit audio or 4 channels.
ALSA_DEVICE=auto

# Overall FluidSynth gain (FluidSynth's own default is 0.2). 0.6 is the loudest setting at which the densest piece tried (La Campanella)
# does not clip in the synthesizer; above it a loud, dense passage with the pedal can crackle. The volume slider of the web interface
# is a scale in dB below and above this value. The loudness of the headphones is set by the sound card volume (Audio output section).
GAIN=0.6

# Maximum number of simultaneous voices. A stereo note uses two voices and the mechanics add more: a dense piece with the pedal needs
# 300-400, and with fewer the synthesizer cuts sounding notes (clicks). 192 was measured on a Pi 3 Model B with CPU_CORES=3 (the busiest thread
# at 23-28%) and still clicked in the final fortissimo of La Campanella; 256 removed those clicks, with a load average of 0.3-0.7 on the
# device. With CPU_CORES=1 use 128
POLYPHONY=256

# Synthesis threads of FluidSynth (synth.cpu-cores). The voices of a dense piece are shared between the cores of the board, so a higher
# POLYPHONY (192 or 256) becomes possible. 1 = everything in one thread. One core is always left to the system (a 4-core board uses at most 3)
CPU_CORES=3

# Audio buffer: period size and number of periods. Latency ~ PERIOD_SIZE * PERIODS / SAMPLE_RATE (64 x 3 at 44.1 kHz = 4.4 ms, 64 x 2 = 2.9 ms).
# PERIOD_SIZE / PERIODS apply to the onboard jack: its driver never takes a period under 10 ms (444 frames) and stops the stream when the
# buffer is shorter than its ~10 ms position reports allow, so its lowest clean buffer is 600 x 2 (27 ms; 444 x 3 = 30 ms also plays clean,
# 444 x 2 clicks all the time: with 2 periods exxpiano-run raises the period to 600 by itself). The GPU adds its own delay on top.
# USB_PERIOD_SIZE / USB_PERIODS apply when a USB card is chosen automatically (a Zoom U-24 on a Pi 3 B: 64 x 2 played 3 x 5 minutes of
# La Campanella without a single xrun, CPU_CORES=3, CPU_GOVERNOR=performance; raise USB_PERIODS to 3 if another card clicks).
PERIOD_SIZE=600
PERIODS=2
# (FluidSynth's minimum period is 64; smaller values are raised to 64. No comments after a value: they would become part of it.)
USB_PERIOD_SIZE=64
USB_PERIODS=2

# Sample rate of the synthesizer: 44100 (the banks are 44.1 kHz), 48000 for a card that plays only 48 kHz natively, 88200 / 96000 halve the
# buffer time but double the synthesis work (on a Pi 3 the polyphony would have to be halved: not for a Pi 3).
SAMPLE_RATE=44100

# CPU frequency governor while the piano plays: performance keeps the cores at full speed, so a small buffer does not click while a core
# speeds up. Empty = leave the kernel's choice.
CPU_GOVERNOR=performance

# Seconds to wait for a USB sound card to appear at boot before falling back to the onboard output
USB_WAIT=8

# 0 - no reverb (less CPU load), 1 - enable it
REVERB=0

# Mechanics and touch options. The web interface rewrites this line; the bridge picks changes up within a second.
FX_ARGS="--velocity-curve 1 --hammer-boost 1.5 --hammer-exp 0.8 --random 1.6 --res-boost 0 --pedal-boost 4.5"

# Web interface (exxpiano-web). Open http://<this-device>:8080/ from a phone or a computer on the same network.
# WEB_TOKEN: if set, the page asks for it before it shows or changes anything. Empty = no password (anybody on your
# network can change these settings, nothing else). WEB_BIND=127.0.0.1 makes the page reachable only from the device itself.
WEB_PORT=8080
WEB_BIND=0.0.0.0
WEB_TOKEN=

# At first boot the installation creates /var/lib/exxpiano/installation-id automatically. The user does not enter it.
# It makes the setup network (exxpiano-Setup-<ID>) and default hostname (exxpiano-<id>) unique.

# Wi-Fi setup. When the Pi has no network (no Ethernet cable, no Wi-Fi it knows) it starts its own network so a phone can choose the home Wi-Fi
# on the web page (tab "Wi-Fi"). Join it with the name and the password below, then the page opens by itself (or go to http://10.42.0.1:8080/).
# Change the password before you hand a device to somebody: it protects the Wi-Fi password typed during the setup. WIFI_SETUP=0 turns it off.
# WIFI_SETUP=1
# WIFI_AP_SSID=exxpiano-Setup
# WIFI_AP_PASSWORD=exxpianosetup
# WIFI_AP_CHANNEL=6
# The Wi-Fi country (two letters) for a card whose wpa_supplicant.conf has none yet; the image builder sets it (--country).
# WIFI_COUNTRY=GB
# Seconds without a network before the setup network starts: with no saved network / with saved ones (a router may boot slower than the Pi).
# WIFI_GRACE_NEW=10
# WIFI_GRACE_KNOWN=150
