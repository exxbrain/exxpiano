name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check that the tag matches VERSION
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"

      - name: Install sound-bank tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run the fast tests
        run: python3 -m unittest discover -s tests -v

      - name: Build the sound banks
        run: |
          scripts/make-soundfonts.sh -p standard -o build
          scripts/make-soundfonts.sh -p full -o build            # about 700 MB, for the second image (boards with 1 GB)
          scripts/make-soundfonts.sh -p lite -o build          # the same downloaded samples; the image uses it on boards with 512 MB

      - name: Read the pinned DietPi image metadata
        run: cat .github/dietpi-image.env >> "$GITHUB_ENV"

      - name: Download and verify the pinned DietPi image from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/cache
          gh release download "$DIETPI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$DIETPI_IMAGE" --dir build/cache
          printf '%s  %s\n' "$DIETPI_SHA256" "build/cache/$DIETPI_IMAGE" | sha256sum -c -

      - name: Enable ARM64 programs in the image builder
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build and verify the standard release image
        run: python3 scripts/build-sd-image.py --dietpi "build/cache/$DIETPI_IMAGE" --variant standard --country RU --timezone Europe/Moscow

      - name: Build and verify the full release image
        run: python3 scripts/build-sd-image.py --dietpi "build/cache/$DIETPI_IMAGE" --variant full --country RU --timezone Europe/Moscow

      - name: Write release checksums
        working-directory: dist/sd
        run: sha256sum ./*.zip manifest-*.json README-*.txt > SHA256SUMS

      - name: Create the GitHub Release and upload the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/sd/*.zip dist/sd/manifest-*.json dist/sd/README-*.txt dist/sd/SHA256SUMS)
          title="exxpiano ${GITHUB_REF_NAME} — SD card image for Raspberry Pi 2/3/4"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" \
              --notes-file .github/release-description.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "$title" \
              --notes-file .github/release-description.md
          fi
