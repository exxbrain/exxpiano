<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70mm" height="57mm" viewBox="0 0 70 57" role="img" aria-labelledby="title desc">
  <title id="title">Концепт наклейки exxpiano 70 на 57 миллиметров</title>
  <desc id="desc">Темно-синяя наклейка с двумя образцами QR-кодов: подключение к Wi-Fi и открытие настройки.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="70" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1224"/>
      <stop offset="1" stop-color="#111D35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77E4FF"/>
      <stop offset="1" stop-color="#3D72FF"/>
    </linearGradient>
    <pattern id="bits-a" width="2.1" height="2.1" patternUnits="userSpaceOnUse">
      <rect width="1.05" height="1.05" fill="#111827"/>
      <rect x="1.05" y="1.05" width="1.05" height="1.05" fill="#111827"/>
      <rect x="1.05" width="1.05" height="1.05" fill="#EFF6FF"/>
      <rect y="1.05" width="1.05" height="1.05" fill="#EFF6FF"/>
    </pattern>
    <pattern id="bits-b" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="1.2" height="1.2" fill="#111827"/>
      <rect x="1.2" y="1.2" width="1.2" height="1.2" fill="#111827"/>
      <rect x="1.2" width="1.2" height="1.2" fill="#EFF6FF"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.8" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Exact finished size: 70 × 57 mm. Keep important content inside the dotted safe area. -->
  <rect width="70" height="57" rx="3" fill="url(#bg)"/>
  <path d="M3 0h3.5v57H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3Z" fill="url(#accent)"/>
  <rect x="2" y="2" width="66" height="53" rx="2" fill="none" stroke="#8DA2C7" stroke-width="0.18" stroke-dasharray="0.7 0.7" opacity="0.42"/>

  <!-- Brand header -->
  <text x="9" y="7.2" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="5.2" font-weight="800" letter-spacing="0.25">exxpiano</text>
  <text x="9.3" y="10.1" fill="#8DA2C7" font-family="Arial, Helvetica, sans-serif" font-size="1.65" font-weight="600" letter-spacing="0.34">SMART PIANO MODULE</text>

  <!-- Minimal piano-key signature -->
  <g transform="translate(53.5 4)" opacity="0.95">
    <rect x="0" y="0" width="2.2" height="6.2" rx="0.35" fill="#F8FAFC"/>
    <rect x="2.55" y="0" width="2.2" height="6.2" rx="0.35" fill="#F8FAFC"/>
    <rect x="5.1" y="0" width="2.2" height="6.2" rx="0.35" fill="#F8FAFC"/>
    <rect x="7.65" y="0" width="2.2" height="6.2" rx="0.35" fill="#F8FAFC"/>
    <rect x="1.55" y="0" width="1.15" height="3.8" rx="0.22" fill="#3D72FF"/>
    <rect x="6.65" y="0" width="1.15" height="3.8" rx="0.22" fill="#3D72FF"/>
  </g>

  <!-- Two action cards -->
  <g filter="url(#shadow)">
    <rect x="9" y="13" width="27.2" height="30" rx="2.2" fill="#F8FAFC"/>
    <rect x="38" y="13" width="27.2" height="30" rx="2.2" fill="#F8FAFC"/>
  </g>

  <!-- Non-functional QR-style sample A -->
  <g transform="translate(12.1 15.1)">
    <rect width="21" height="21" rx="0.5" fill="#EFF6FF"/>
    <rect x="1" y="1" width="19" height="19" fill="url(#bits-a)"/>
    <g fill="#111827">
      <rect x="1" y="1" width="6" height="6" rx="0.3"/><rect x="14" y="1" width="6" height="6" rx="0.3"/><rect x="1" y="14" width="6" height="6" rx="0.3"/>
    </g>
    <g fill="#EFF6FF">
      <rect x="2.2" y="2.2" width="3.6" height="3.6"/><rect x="15.2" y="2.2" width="3.6" height="3.6"/><rect x="2.2" y="15.2" width="3.6" height="3.6"/>
    </g>
    <g fill="#111827">
      <rect x="3.1" y="3.1" width="1.8" height="1.8"/><rect x="16.1" y="3.1" width="1.8" height="1.8"/><rect x="3.1" y="16.1" width="1.8" height="1.8"/>
    </g>
  </g>

  <!-- Non-functional QR-style sample B -->
  <g transform="translate(41.1 15.1)">
    <rect width="21" height="21" rx="0.5" fill="#EFF6FF"/>
    <rect x="1" y="1" width="19" height="19" fill="url(#bits-b)"/>
    <g fill="#111827">
      <rect x="1" y="1" width="6" height="6" rx="0.3"/><rect x="14" y="1" width="6" height="6" rx="0.3"/><rect x="1" y="14" width="6" height="6" rx="0.3"/>
    </g>
    <g fill="#EFF6FF">
      <rect x="2.2" y="2.2" width="3.6" height="3.6"/><rect x="15.2" y="2.2" width="3.6" height="3.6"/><rect x="2.2" y="15.2" width="3.6" height="3.6"/>
    </g>
    <g fill="#111827">
      <rect x="3.1" y="3.1" width="1.8" height="1.8"/><rect x="16.1" y="3.1" width="1.8" height="1.8"/><rect x="3.1" y="16.1" width="1.8" height="1.8"/>
    </g>
  </g>

  <!-- Action labels -->
  <circle cx="13.5" cy="39.5" r="1.55" fill="#3D72FF"/>
  <text x="13.5" y="40.25" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="1.9" font-weight="800">1</text>
  <text x="16.1" y="39.2" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="800">ПОДКЛЮЧИТЬ</text>
  <text x="16.1" y="41.4" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="1.45" font-weight="600">к сети настройки</text>

  <circle cx="42.5" cy="39.5" r="1.55" fill="#3D72FF"/>
  <text x="42.5" y="40.25" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="1.9" font-weight="800">2</text>
  <text x="45.1" y="39.2" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="800">НАСТРОИТЬ</text>
  <text x="45.1" y="41.4" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="1.45" font-weight="600">звук и Wi-Fi</text>

  <!-- Device identity footer. Sample values only. -->
  <path d="M9 46h56.2" stroke="#31415E" stroke-width="0.3"/>
  <text x="9" y="49.7" fill="#77E4FF" font-family="Arial, Helvetica, sans-serif" font-size="1.7" font-weight="800" letter-spacing="0.13">УСТРОЙСТВО</text>
  <text x="22.5" y="49.7" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="700">D2F2F1DE</text>
  <text x="65.2" y="49.7" text-anchor="end" fill="#8DA2C7" font-family="Arial, Helvetica, sans-serif" font-size="1.55">exxpiano.local:8080</text>
  <text x="9" y="53.25" fill="#8DA2C7" font-family="Arial, Helvetica, sans-serif" font-size="1.45">Камера телефона → код 1 → код 2</text>
  <text x="65.2" y="53.25" text-anchor="end" fill="#8DA2C7" font-family="Arial, Helvetica, sans-serif" font-size="1.45">70 × 57 mm</text>

  <!-- Visible safety note for the concept preview; remove when real QR codes are inserted. -->
  <text x="35" y="56" text-anchor="middle" fill="#77E4FF" font-family="Arial, Helvetica, sans-serif" font-size="1.05" font-weight="700" letter-spacing="0.12">КОНЦЕПТ • QR-КОДЫ НЕРАБОЧИЕ</text>
</svg>
