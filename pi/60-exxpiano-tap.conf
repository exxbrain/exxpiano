# The audio device `exxpiano_tap:'<card>'` plays through <card> and puts a copy of everything that goes to the card into a pipe, where
# exxpiano-meter.py measures the level of the left and the right channel (and the clipped samples) for the web interface.
# exxpiano-run chooses it itself; nothing else uses it. Installed as /etc/alsa/conf.d/60-exxpiano-tap.conf.
pcm.exxpiano_tap {
    @args [ SLAVE ]
    @args.SLAVE { type string }
    type file
    slave.pcm $SLAVE
    file "/run/exxpiano-meter/pcm"
    format "raw"
}
