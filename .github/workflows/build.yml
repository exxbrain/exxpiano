name: build

# Every push and pull request: run the tests and verify the complete DietPi image pipeline.
# Personalized images are production outputs and are never uploaded by CI.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (the builder tests use it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: The tag must match the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

      - name: Complete DietPi image pipeline on the stand-in
        run: scripts/test-sd-image-pipeline.sh
