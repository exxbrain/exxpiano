# /etc/piano-synth.conf - synthesizer settings.
# After editing:  sudo systemctl restart piano-synth piano-fx

# Sound banks (made by scripts/make-soundfonts.sh)
PIANO_SF2=/opt/piano-synth/soundfonts/piano.sf2
MECH_SF2=/opt/piano-synth/soundfonts/mech.sf2

# Folder with the piano banks that the web page offers under "Piano bank" (*.sf2 / *.sf3; the mechanics bank is never offered).
BANK_DIR=/opt/piano-synth/soundfonts

# Where the web page remembers the touch, volume, mechanics and preset of each bank (one JSON file).
PROFILE_FILE=/var/lib/piano-synth/profiles.json
# Same for the buffers of each audio interface (devices.json in the same folder unless set here):
# DEVICE_PROFILE_FILE=/var/lib/piano-synth/devices.json

# Written by the web page after every successful bank switch: the bank to fall back to when PIANO_SF2 is missing or damaged.
PIANO_SF2_LAST_GOOD=

# Audio output. auto = a USB sound card if one is present, otherwise the onboard 3.5 mm jack (re-chosen when a USB
# card is plugged in or removed). Or name one explicitly (see `aplay -l`), e.g. plughw:Headphones or plughw:U24.
# Always use the "plughw" form: USB interfaces often accept only 24/32-bit audio or 4 channels.
ALSA_DEVICE=auto

# Overall FluidSynth gain (FluidSynth's own default is 0.2; these banks want 1.0, the mono preset 'small' wants 2.0)
GAIN=1.0

# Maximum number of simultaneous voices. Stereo piano + mechanics: 128 leaves headroom
POLYPHONY=128

# Audio buffer: period size and number of periods. Latency ~ PERIOD_SIZE * PERIODS / 44100.
# PERIOD_SIZE / PERIODS apply to the onboard jack (the driver rounds the period up to 444 by itself, 2 periods click; 64 x 3 had no clicks);
# USB_PERIOD_SIZE / USB_PERIODS apply when a USB card is chosen automatically (64 x 3 worked with a Zoom U-24).
PERIOD_SIZE=64
PERIODS=3
# (FluidSynth's minimum period is 64; smaller values are raised to 64. No comments after a value: systemd would keep them.)
USB_PERIOD_SIZE=64
USB_PERIODS=3

# Seconds to wait for a USB sound card to appear at boot before falling back to the onboard output
USB_WAIT=8

# 0 - no reverb (less CPU load), 1 - enable it
REVERB=0

# Mechanics and touch options. The web interface rewrites this line; the bridge picks changes up within a second.
FX_ARGS="--velocity-curve 1 --hammer-boost 0 --hammer-exp 0.8 --random 1 --res-boost 0 --pedal-boost 0"

# Web interface (piano-web). Open http://<this-device>:8080/ from a phone or a computer on the same network.
# WEB_TOKEN: if set, the page asks for it before it shows or changes anything. Empty = no password (anybody on your
# network can change these settings, nothing else). WEB_BIND=127.0.0.1 makes the page reachable only from the device itself.
WEB_PORT=8080
WEB_BIND=0.0.0.0
WEB_TOKEN=

# Wi-Fi setup. When the Pi has no network (no Ethernet cable, no Wi-Fi it knows) it starts its own network so a phone can choose the home Wi-Fi
# on the web page (tab "Wi-Fi"). Join it with the name and the password below, then the page opens by itself (or go to http://10.42.0.1:8080/).
# Change the password before you hand a device to somebody: it protects the Wi-Fi password typed during the setup. WIFI_SETUP=0 turns it off.
# WIFI_SETUP=1
# WIFI_AP_SSID=Piano-Setup
# WIFI_AP_PASSWORD=pianosetup
# WIFI_AP_CHANNEL=6
# Seconds without a network before the setup network starts: with no saved network / with saved ones (a router may boot slower than the Pi).
# WIFI_GRACE_NEW=30
# WIFI_GRACE_KNOWN=150
