name: build

# Every push and pull request gets the fast test suite. The package and image checks and the release image build
# live in separate workflows because they are much slower.
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (the builder tests use it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Tests
        run: python3 -m unittest discover -s tests -v
