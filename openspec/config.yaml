schema: spec-driven

context: |
  Language: ru
  Write all artifact prose in Russian.
  Keep only parser-defined OpenSpec structural headings such as Purpose,
  Requirements, Requirement, and Scenario in English.
  Keep normative keywords such as MUST and SHALL in English.
  This repository builds a Raspberry Pi 3 digital piano around FluidSynth,
  Salamander Grand Piano soundfonts, a Python MIDI mechanics bridge, a
  standard-library web UI, and an Alpine Linux SD image builder.
  Runtime code targets Alpine Linux 3.24 aarch64 (sys mode, musl, OpenRC with
  supervise-daemon, eudev, busybox syslog) and uses Python 3 plus Bash. The
  application ships as signed .apk packages built with abuild. Keep the web
  server dependency-free unless a proposal explicitly justifies a dependency.
  Treat /etc/exxpiano.conf as the persisted environment file of the OpenRC
  services (read literally by exxpiano-env, never sourced by a shell) and keep
  its existing validation and atomic-write guarantees.
  Run `python3 -m unittest discover -s tests -v` for repository verification.
  Distinguish automated coverage from real Raspberry Pi verification. Never
  claim that first boot, an SD image, USB hotplug, or audio quality was tested
  on hardware unless the task includes that evidence.
  Before every major release (X.Y.0) the released image is checked on a real
  Raspberry Pi 3 Model B: the piano, the preview (first note within 15 s of
  power-on) and Wi-Fi; the checklist is in docs/BUILDING.md ("Before a major
  release"), the results go into the CHANGELOG.

rules:
  proposal:
    - Указывать, требуется ли проверка на реальной Raspberry Pi или она остаётся невыполненной
  specs:
    - Описывать наблюдаемое поведение и явные сценарии ошибки или отката
    - Сохранять совместимость с ограничениями Raspberry Pi 3, если proposal явно не говорит обратное
  tasks:
    - Размещать тесты рядом с задачей реализации, которую они проверяют
    - Добавлять проверку на оборудовании только когда её нельзя заменить детерминированным автотестом

operations:
  apply:
    guidance:
      - При изменении поведения синхронно обновлять английскую и русскую пользовательскую документацию
  archive:
    guidance:
      - Фиксировать все оставшиеся невыполненными проверки на оборудовании
